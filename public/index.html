<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>骑手算法透明助手</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { background-color: #ffffff; margin: 0; }
    .spinner {
      border: 2px solid #e5e7eb;
      border-top-color: #eab308;
      border-radius: 50%; width: 16px; height: 16px;
      animation: spin 0.7s linear infinite; display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }
    .risk-ring {
      width: 96px; height: 96px;
      border-radius: 50%;
      background: conic-gradient(#f59e0b var(--pct), #f3f4f6 var(--pct));
      display: flex; align-items: center; justify-content: center;
    }
    .risk-ring-inner {
      width: 72px; height: 72px; border-radius: 50%;
      background: white; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    const riderData = { name: '李师傅', id: 'KS-20847', deliveryCount: 12, onTimeRate: 94, earnings: 286, fatigueLevel: '中', safetyScore: 59, safeDays: 12, safetyTrend: '+3' };

    const notifications = [
      { id: 1, icon: '⏱', color: 'bg-blue-50 border-blue-200', text: '订单时间已自动延长：28min → 35min（路况拥堵，AI 已为你争取）', time: '3分钟前' },
      { id: 2, icon: '😴', color: 'bg-orange-50 border-orange-200', text: '你已连续接单 4 小时，建议休息 10 分钟，有助于降低违章风险', time: '12分钟前' },
      { id: 3, icon: '🌧', color: 'bg-green-50 border-green-200', text: '雨天安全奖励已到账 ¥8，感谢你今天的安全骑行', time: '1小时前' },
    ];

    const orders = [
      { id: 1, restaurant: '沙县小吃（中关村店）', destination: '科技园A座1801', distance: 2.3, traffic: '高峰期拥堵', allocatedTime: 26, suggestedTime: 30, onTimeRate: 94, reasonCode: 'PEAK_HOUR_COMPRESSION', status: 'warning', riskLevel: '中', riskReasons: ['拥堵', '连续工作'] },
      { id: 2, restaurant: '海底捞（望京SOHO店）', destination: '望京西路15号', distance: 3.8, traffic: '严重拥堵，事故路段', allocatedTime: 28, suggestedTime: 35, onTimeRate: 94, reasonCode: 'TRAFFIC_UNDERESTIMATE', status: 'danger', riskLevel: '高', riskReasons: ['拥堵', '事故', '雨天'] },
      { id: 3, restaurant: '瑞幸咖啡（五道口）', destination: '清华东路18号院', distance: 1.1, traffic: '畅通', allocatedTime: 20, suggestedTime: 20, onTimeRate: 94, reasonCode: 'NORMAL', status: 'good', riskLevel: '低', riskReasons: [] },
    ];

    const appealHistory = [
      { id: 'AP-2847', issue: '配送时间被压缩（海底捞订单）', status: '处理中', statusColor: 'text-orange-500', time: '今天 14:32', eta: '预计 5 分钟内响应' },
    ];

    /* ── 实时风险评分 ── */
    function RealTimeRisk() {
      const score = 85;
      const radius = 54;
      const circ = 2 * Math.PI * radius;
      const offset = circ * (1 - score / 100);
      const metrics = [
        { label: '疲劳等级', value: '中', unit: '',     barColor: '#c97b3a', barPct: 50 },
        { label: '心率估算', value: '123', unit: 'bpm', barColor: '#c97b3a', barPct: 62 },
        { label: '当前速度', value: '38', unit: 'km/h', barColor: '#d4503a', barPct: 72 },
        { label: '在线时长', value: '5.0', unit: 'h',   barColor: '#c97b3a', barPct: 80 },
      ];
      return (
        <div className="bg-white rounded-2xl p-5 shadow-sm" style={{background:'#faf9f7'}}>
          <div className="flex items-center gap-2 mb-5">
            <span className="w-4 h-4 rounded-full border-2 border-gray-400 flex-shrink-0 flex items-center justify-center">
              <span className="w-1.5 h-1.5 rounded-full bg-gray-400 inline-block"></span>
            </span>
            <h3 className="text-gray-800 font-semibold text-base">实时风险评分</h3>
          </div>
          {/* 环形评分 */}
          <div className="flex justify-center mb-6">
            <div className="relative w-36 h-36">
              <svg width="144" height="144" viewBox="0 0 144 144">
                <circle cx="72" cy="72" r={radius} fill="none" stroke="#ede9e4" strokeWidth="12"/>
                <circle cx="72" cy="72" r={radius} fill="none" stroke="#c97040" strokeWidth="12"
                  strokeDasharray={circ} strokeDashoffset={offset}
                  strokeLinecap="round"
                  transform="rotate(-90 72 72)"/>
              </svg>
              <div className="absolute inset-0 flex flex-col items-center justify-center">
                <span className="text-4xl font-black leading-none" style={{color:'#c97040'}}>{score}</span>
                <span className="text-gray-400 text-sm mt-0.5">高风险</span>
              </div>
            </div>
          </div>
          {/* 四格指标 */}
          <div className="grid grid-cols-2 gap-3 mb-3">
            {metrics.map((m, i) => (
              <div key={i} className="bg-white rounded-2xl p-4" style={{boxShadow:'0 1px 4px rgba(0,0,0,0.06)'}}>
                <div className="text-gray-400 text-xs mb-1">{m.label}</div>
                <div className="flex items-baseline gap-1 mb-3">
                  <span className="text-gray-900 font-black text-2xl leading-none">{m.value}</span>
                  {m.unit && <span className="text-gray-500 text-sm">{m.unit}</span>}
                </div>
                <div className="h-1 rounded-full" style={{background:'#ede9e4'}}>
                  <div className="h-full rounded-full" style={{width:`${m.barPct}%`, background: m.barColor}}></div>
                </div>
              </div>
            ))}
          </div>
          {/* 天气风险 */}
          <div className="bg-white rounded-2xl p-4" style={{boxShadow:'0 1px 4px rgba(0,0,0,0.06)'}}>
            <div className="flex items-center justify-between mb-3">
              <div className="text-gray-400 text-xs">今日天气风险</div>
              <span className="text-xs font-semibold px-2 py-0.5 rounded-full" style={{background:'#fff3e0', color:'#c97040'}}>中等风险</span>
            </div>
            <div className="flex items-center gap-4">
              <div className="flex items-center gap-2">
                <span className="text-3xl">🌧</span>
                <div>
                  <div className="text-gray-900 font-black text-xl leading-none">小雨</div>
                  <div className="text-gray-400 text-xs mt-0.5">18°C · 东北风 4 级</div>
                </div>
              </div>
              <div className="flex-1">
                <div className="flex justify-between text-xs text-gray-400 mb-1">
                  <span>路面湿滑概率</span><span>65%</span>
                </div>
                <div className="h-1 rounded-full" style={{background:'#ede9e4'}}>
                  <div className="h-full rounded-full" style={{width:'65%', background:'#c97040'}}></div>
                </div>
                <div className="text-xs mt-2" style={{color:'#c97040'}}>⚠️ 建议减速，雨天补贴已激活</div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function NotificationList() {
      return (
        <div>
          <h3 className="text-yellow-500 font-bold mb-3">AI 动态决策通知</h3>
          <div className="space-y-2">
            {notifications.map(n => (
              <div key={n.id} className={`${n.color} border rounded-xl p-3 flex items-start gap-3`}>
                <span className="text-xl flex-shrink-0">{n.icon}</span>
                <div className="flex-1 min-w-0">
                  <p className="text-black text-sm leading-relaxed">{n.text}</p>
                  <span className="text-gray-400 text-xs">{n.time}</span>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    /* ── 激励成长轨道 ── */
    function GrowthTrack() {
      const milestones = [
        { label: '新手骑手', icon: '🚲', score: 0,   done: true },
        { label: '安全达人', icon: '🛡️', score: 50,  done: true },
        { label: '黄金骑手', icon: '⭐', score: 70,  done: false, current: true },
        { label: '安全大使', icon: '🏆', score: 90,  done: false },
      ];
      const rewards = [
        { icon: '⚡', text: '优先派单权', unlocked: true },
        { icon: '☂️', text: '天气补贴', unlocked: true },
        { icon: '🎁', text: '月度奖励 ¥50', unlocked: false },
        { icon: '👑', text: '安全大使称号', unlocked: false },
      ];
      return (
        <div className="bg-white rounded-2xl border-2 border-yellow-200 p-4 shadow-sm">
          <div className="flex items-center justify-between mb-4">
            <h3 className="text-yellow-500 font-bold">激励成长轨道</h3>
            <span className="text-xs text-gray-400">安全积分 {riderData.safetyScore}/100</span>
          </div>
          {/* 里程碑轨道 */}
          <div className="relative mb-5">
            <div className="absolute top-5 left-6 right-6 h-1 bg-gray-100 rounded-full z-0">
              <div className="h-full bg-yellow-400 rounded-full" style={{width: '45%'}}></div>
            </div>
            <div className="relative z-10 flex justify-between">
              {milestones.map((m, i) => (
                <div key={i} className="flex flex-col items-center gap-1" style={{width: '25%'}}>
                  <div className={`w-10 h-10 rounded-full flex items-center justify-center text-lg border-2 ${m.current ? 'border-yellow-400 bg-yellow-50 shadow-md' : m.done ? 'border-green-400 bg-green-50' : 'border-gray-200 bg-gray-50'}`}>
                    {m.icon}
                  </div>
                  <span className={`text-xs text-center leading-tight ${m.current ? 'text-yellow-600 font-bold' : m.done ? 'text-green-600' : 'text-gray-400'}`}>{m.label}</span>
                  {m.current && <span className="text-yellow-500 text-xs font-bold">← 当前</span>}
                </div>
              ))}
            </div>
          </div>
          {/* 下一目标 */}
          <div className="bg-yellow-50 rounded-xl p-3 mb-4">
            <div className="flex items-center justify-between mb-1">
              <span className="text-black text-sm font-medium">距离「安全大使」还差</span>
              <span className="text-yellow-600 font-bold text-sm">31 分</span>
            </div>
            <div className="h-2 bg-yellow-100 rounded-full overflow-hidden">
              <div className="h-full bg-yellow-400 rounded-full" style={{width: `${riderData.safetyScore}%`}}></div>
            </div>
          </div>
          {/* 已解锁奖励 */}
          <div className="text-xs text-gray-500 mb-2">已解锁权益</div>
          <div className="grid grid-cols-2 gap-2">
            {rewards.map((r, i) => (
              <div key={i} className={`flex items-center gap-2 rounded-lg p-2.5 border ${r.unlocked ? 'bg-green-50 border-green-200' : 'bg-gray-50 border-gray-100 opacity-50'}`}>
                <span className="text-lg">{r.icon}</span>
                <span className={`text-xs font-medium ${r.unlocked ? 'text-green-700' : 'text-gray-400'}`}>{r.text}</span>
                {!r.unlocked && <span className="ml-auto text-gray-300 text-xs">🔒</span>}
              </div>
            ))}
          </div>
        </div>
      );
    }

    /* AI 解释弹窗 */
    function ExplainModal({ order, onClose }) {
      const [explanation, setExplanation] = useState('');
      const [loading, setLoading] = useState(true);
      useEffect(() => {
        fetch('/api/explain', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ orderData: order }) })
          .then(r => r.json())
          .then(d => { setExplanation(d.explanation || d.error); setLoading(false); })
          .catch(() => { setExplanation('获取解释失败，请重试。'); setLoading(false); });
      }, []);
      return (
        <div className="fixed inset-0 bg-black/50 z-50 flex items-end justify-center" onClick={onClose}>
          <div className="bg-white rounded-t-2xl w-full max-w-md p-6 pb-8" onClick={e => e.stopPropagation()}>
            <div className="flex items-center justify-between mb-4">
              <h2 className="text-black font-bold text-lg">🤖 AI 算法解释</h2>
              <button onClick={onClose} className="text-gray-400 text-xl">×</button>
            </div>
            <div className="bg-gray-50 rounded-xl p-3 mb-4 text-sm">
              <div className="text-yellow-500 font-semibold truncate">{order.restaurant}</div>
              <div className="text-gray-400 text-xs mt-0.5">→ {order.destination}</div>
            </div>
            {loading ? (
              <div className="flex items-center gap-3 py-6 justify-center text-gray-400 text-sm">
                <span className="spinner"></span> 正在分析算法决策…
              </div>
            ) : (
              <div className="bg-yellow-50 border border-yellow-200 rounded-xl p-4">
                <p className="text-black text-sm leading-relaxed">{explanation}</p>
              </div>
            )}
            <div className="mt-3 bg-green-50 rounded-xl p-3 text-xs text-green-700">
              ✅ 该调整不会影响骑手绩效考核
            </div>
            <button onClick={onClose} className="mt-4 w-full bg-gray-100 hover:bg-gray-200 text-black py-3 rounded-xl text-sm font-medium">关闭</button>
          </div>
        </div>
      );
    }

    /* 骑手反馈弹窗 */
    function FeedbackModal({ order, onClose }) {
      const options = [
        { id: 'traffic',  label: '路况异常',   icon: '🚦', desc: '实际路况比预测更拥堵' },
        { id: 'fatigue',  label: '身体疲劳',   icon: '😓', desc: '已连续工作时间过长' },
        { id: 'restaurant', label: '商家出餐慢', icon: '🍜', desc: '等餐时间超出预期' },
        { id: 'address',  label: '地址不清楚', icon: '📍', desc: '目的地难以找到' },
      ];
      const [selected, setSelected] = useState([]);
      const [result, setResult] = useState('');
      const [loading, setLoading] = useState(false);
      const [submitted, setSubmitted] = useState(false);

      function toggle(id) {
        setSelected(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
      }

      async function handleSubmit() {
        if (!selected.length) return;
        setLoading(true);
        const labels = selected.map(id => options.find(o => o.id === id).label).join('、');
        try {
          const res = await fetch('/api/appeal', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ orderData: order, appealReason: labels }) });
          const data = await res.json();
          setResult(data.result || data.error); setSubmitted(true);
        } catch { setResult('提交失败，请重试。'); setSubmitted(true); }
        finally { setLoading(false); }
      }

      return (
        <div className="fixed inset-0 bg-black/50 z-50 flex items-end justify-center" onClick={onClose}>
          <div className="bg-white rounded-t-2xl w-full max-w-md p-6 pb-8" onClick={e => e.stopPropagation()}>
            <div className="flex items-center justify-between mb-1">
              <h2 className="text-black font-bold text-lg">骑手反馈 / 申诉</h2>
              <button onClick={onClose} className="text-gray-400 text-xl">×</button>
            </div>
            <p className="text-gray-400 text-xs mb-4">选择遇到的情况（可多选）</p>
            {!submitted ? (
              <>
                <div className="grid grid-cols-2 gap-2 mb-4">
                  {options.map(o => (
                    <button key={o.id} onClick={() => toggle(o.id)}
                      className={`flex items-start gap-2 p-3 rounded-xl border-2 text-left transition-colors ${selected.includes(o.id) ? 'border-yellow-400 bg-yellow-50' : 'border-gray-100 bg-gray-50'}`}>
                      <span className="text-xl flex-shrink-0">{o.icon}</span>
                      <div>
                        <div className={`text-sm font-semibold ${selected.includes(o.id) ? 'text-yellow-700' : 'text-black'}`}>{o.label}</div>
                        <div className="text-gray-400 text-xs leading-snug mt-0.5">{o.desc}</div>
                      </div>
                    </button>
                  ))}
                </div>
                <button onClick={handleSubmit} disabled={!selected.length || loading}
                  className="w-full bg-black hover:bg-gray-800 disabled:bg-gray-200 disabled:text-gray-400 text-white font-semibold py-3 rounded-xl transition-colors flex items-center justify-center gap-2">
                  {loading ? <><span className="spinner"></span> 处理中…</> : `提交反馈（已选 ${selected.length} 项）`}
                </button>
              </>
            ) : (
              <div className="bg-green-50 border border-green-200 rounded-xl p-4">
                <div className="text-green-600 font-semibold text-sm mb-2">📋 AI 处理结果</div>
                <p className="text-black text-sm leading-relaxed">{result}</p>
                <button onClick={onClose} className="mt-4 w-full bg-gray-100 hover:bg-gray-200 text-black py-2 rounded-lg text-sm">关闭</button>
              </div>
            )}
          </div>
        </div>
      );
    }

    function OrderCard({ order }) {
      const [showExplain, setShowExplain] = useState(false);
      const [showFeedback, setShowFeedback] = useState(false);

      const riskConfig = {
        '低': { color: 'text-green-600', bg: 'bg-green-100', border: 'border-gray-200' },
        '中': { color: 'text-orange-500', bg: 'bg-orange-100', border: 'border-orange-200' },
        '高': { color: 'text-red-600',   bg: 'bg-red-100',   border: 'border-red-300' },
      };
      const reasonConfig = {
        '拥堵':   { icon: '🚦', bg: 'bg-orange-50 text-orange-600' },
        '事故':   { icon: '⚠️', bg: 'bg-red-50 text-red-600' },
        '雨天':   { icon: '🌧', bg: 'bg-blue-50 text-blue-600' },
        '连续工作': { icon: '⏰', bg: 'bg-purple-50 text-purple-600' },
      };
      const rc = riskConfig[order.riskLevel] || riskConfig['低'];

      return (
        <div className={`bg-white rounded-2xl p-4 border-2 ${rc.border} shadow-sm`}>
          {/* 标题行 */}
          <div className="flex items-start justify-between mb-3">
            <div className="flex-1 min-w-0">
              <div className="text-yellow-500 font-bold text-sm truncate">{order.restaurant}</div>
              <div className="text-gray-400 text-xs mt-0.5 flex items-center gap-1">→ <span className="truncate">{order.destination}</span></div>
            </div>
            <span className={`ml-2 shrink-0 text-xs font-semibold px-2.5 py-1 rounded-full ${rc.bg} ${rc.color}`}>
              {order.riskLevel}风险
            </span>
          </div>

          {/* 时间对比 */}
          <div className="bg-gray-50 rounded-2xl p-3 mb-3">
            <div className="flex items-center gap-2 mb-2">
              <span className="text-gray-400 text-xs">📍 {order.distance}km</span>
            </div>
            <div className="flex items-center gap-2">
              {/* 平台原时效 */}
              <div className="flex-1 bg-white rounded-xl p-2.5 text-center border border-gray-200">
                <div className="text-gray-400 text-xs mb-1">平台原时效</div>
                <div className="text-gray-500 font-bold text-xl line-through decoration-2">{order.allocatedTime}<span className="text-xs font-normal">min</span></div>
              </div>
              {/* 箭头 */}
              <div className="flex flex-col items-center gap-0.5 flex-shrink-0">
                <div className="text-green-500 text-xs font-semibold">AI调整</div>
                <div className="text-green-500 text-lg leading-none">↓</div>
              </div>
              {/* AI调整后 */}
              <div className="flex-1 bg-green-50 rounded-xl p-2.5 text-center border border-green-300">
                <div className="text-green-600 text-xs mb-1">AI 安全调整后</div>
                <div className="text-green-600 font-black text-xl">{order.suggestedTime}<span className="text-xs font-normal">min</span></div>
                {order.suggestedTime > order.allocatedTime && (
                  <div className="text-green-500 text-xs font-medium mt-0.5">当前生效 ✓</div>
                )}
              </div>
            </div>
          </div>

          {/* 风险原因标签 */}
          {order.riskReasons.length > 0 && (
            <div className="flex flex-wrap gap-1.5 mb-3">
              {order.riskReasons.map(r => (
                <span key={r} className={`inline-flex items-center gap-1 text-xs px-2 py-0.5 rounded-full ${reasonConfig[r]?.bg || 'bg-gray-100 text-gray-500'}`}>
                  {reasonConfig[r]?.icon} {r}
                </span>
              ))}
            </div>
          )}

          {/* 按钮 */}
          <div className="flex gap-2">
            <button onClick={() => setShowExplain(true)}
              className="flex-1 bg-yellow-400 hover:bg-yellow-300 text-black text-xs font-medium py-2.5 rounded-xl transition-colors">
              查看 AI 解释
            </button>
            <button onClick={() => setShowFeedback(true)}
              className="flex-1 bg-black hover:bg-gray-800 text-white text-xs font-medium py-2.5 rounded-xl transition-colors">
              骑手反馈 / 申诉
            </button>
          </div>

          {showExplain   && <ExplainModal  order={order} onClose={() => setShowExplain(false)} />}
          {showFeedback  && <FeedbackModal order={order} onClose={() => setShowFeedback(false)} />}
        </div>
      );
    }

    function HRModal({ onClose }) {
      const [issueType, setIssueType] = useState('');
      const [desc, setDesc] = useState('');
      const [submitted, setSubmitted] = useState(false);
      const types = ['配送时间被压缩', '罚款/扣分申诉', '安全事故报告', '其他问题'];
      return (
        <div className="fixed inset-0 bg-black/50 z-50 flex items-end justify-center" onClick={onClose}>
          <div className="bg-white rounded-t-2xl w-full max-w-md p-6 pb-8" onClick={e => e.stopPropagation()}>
            <div className="flex items-center justify-between mb-4">
              <div>
                <h2 className="text-black font-bold text-lg">联系 HR 绿色通道</h2>
                <div className="flex items-center gap-1 mt-0.5"><span className="w-2 h-2 rounded-full bg-green-500 inline-block"></span><span className="text-green-600 text-xs font-medium">5 分钟响应承诺</span></div>
              </div>
              <button onClick={onClose} className="text-gray-400 text-xl">×</button>
            </div>
            {!submitted ? (
              <>
                <div className="mb-3">
                  <div className="text-sm text-gray-600 mb-2">问题类型</div>
                  <div className="grid grid-cols-2 gap-2">
                    {types.map(t => (
                      <button key={t} onClick={() => setIssueType(t)} className={`py-2 px-3 rounded-lg text-xs border transition-colors ${issueType === t ? 'bg-yellow-400 border-yellow-400 text-black font-medium' : 'bg-gray-50 border-gray-200 text-gray-600'}`}>{t}</button>
                    ))}
                  </div>
                </div>
                <textarea className="w-full bg-gray-100 text-black rounded-lg p-3 text-sm resize-none border border-gray-300 focus:border-yellow-400 focus:outline-none mb-3" rows={3} placeholder="请描述你的问题…" value={desc} onChange={e => setDesc(e.target.value)} />
                <button onClick={() => setSubmitted(true)} disabled={!issueType || !desc.trim()} className="w-full bg-green-500 hover:bg-green-400 disabled:bg-gray-200 disabled:text-gray-400 text-white font-semibold py-3 rounded-xl transition-colors">提交给 HR</button>
              </>
            ) : (
              <div className="bg-green-50 border border-green-300 rounded-xl p-4 text-center">
                <div className="text-3xl mb-2">✅</div>
                <div className="text-green-700 font-semibold">已提交成功</div>
                <div className="text-gray-500 text-sm mt-1">HR 将在 5 分钟内联系你</div>
                <button onClick={onClose} className="mt-4 w-full bg-gray-100 hover:bg-gray-200 text-black py-2 rounded-lg text-sm">关闭</button>
              </div>
            )}
          </div>
        </div>
      );
    }

    /* ── Tab 页面 ── */

    function HomeTab() {
      return (
        <div className="p-4 space-y-4">
          <RealTimeRisk />
          <NotificationList />
        </div>
      );
    }

    function OrdersTab() {
      return (
        <div className="p-4 space-y-4">
          <div className="flex items-center justify-between">
            <h2 className="text-yellow-500 font-bold">当前配送任务</h2>
            <span className="text-gray-400 text-xs">{orders.length} 单</span>
          </div>
          {orders.map(order => <OrderCard key={order.id} order={order} />)}
        </div>
      );
    }

    function ProfileTab() {
      const [showHR, setShowHR] = useState(false);
      const dataUsage = [
        { icon: '🛡️', label: '疲劳保护', desc: '自动延长高风险订单时间，保护您不被扣分', iconBg: 'bg-red-50' },
        { icon: '💰', label: '安全补贴资格', desc: '安全积分 ≥ 80 可解锁优先接单 + 天气补贴', iconBg: 'bg-yellow-50' },
        { icon: '📋', label: '风险预警', desc: '仅用于保护您，不作为考核或处罚依据', iconBg: 'bg-gray-100' },
      ];
      return (
        <div className="p-4 space-y-4">
          {/* 我的安全报告 */}
          <div className="bg-green-50 rounded-2xl p-4 border border-green-200">
            <div className="flex items-center gap-1 mb-3">
              <span className="text-yellow-500">★</span>
              <h3 className="text-black font-bold">我的安全报告</h3>
            </div>
            <div className="bg-white rounded-xl p-4 flex items-center justify-between mb-2">
              <div>
                <div className="text-green-600 text-xs mb-1">今日安全积分</div>
                <div className="text-black font-black text-4xl">{riderData.safetyScore}</div>
              </div>
              <div className="text-right">
                <div className="text-green-600 text-xs mb-1">连续安全天数</div>
                <div className="text-black font-black text-3xl">{riderData.safeDays} 天</div>
                <div className="text-green-600 text-xs font-medium">{riderData.safetyTrend} 较上周</div>
              </div>
            </div>
            {/* 积分明细 */}
            <div className="bg-white rounded-xl px-4 py-3 mb-4 border border-green-100">
              <div className="text-gray-400 text-xs mb-2">今日积分构成</div>
              <div className="flex flex-wrap gap-x-3 gap-y-1 text-xs">
                <span className="text-green-600">准时送达 <b>+12</b></span>
                <span className="text-green-600">AI调整接受 <b>+5</b></span>
                <span className="text-red-400">雨天轻微超速 <b>−8</b> <span className="text-gray-400">（已享保护折扣）</span></span>
              </div>
              <div className="mt-2 pt-2 border-t border-gray-100 flex items-center justify-between">
                <span className="text-gray-400 text-xs">净得</span>
                <span className="text-green-600 font-bold text-sm">+9 分</span>
              </div>
            </div>
            <div className="text-gray-500 text-xs mb-3">您的数据用于：</div>
            <div className="space-y-3">
              {dataUsage.map((item, i) => (
                <div key={i} className="flex items-center gap-3 bg-white rounded-xl p-3">
                  <div className={`w-10 h-10 rounded-xl ${item.iconBg} flex items-center justify-center text-xl flex-shrink-0`}>{item.icon}</div>
                  <div>
                    <div className="text-black font-semibold text-sm">{item.label}</div>
                    <div className="text-gray-500 text-xs">{item.desc}</div>
                  </div>
                </div>
              ))}
            </div>
          </div>

          {/* 激励成长轨道 */}
          <GrowthTrack />

          {/* HR 绿色通道 */}
          <div className="bg-white rounded-2xl border-2 border-green-200 p-4 shadow-sm">
            <div className="flex items-center gap-2 mb-3">
              <h3 className="text-black font-bold">HR 申诉绿色通道</h3>
              <div className="flex items-center gap-1 bg-green-100 px-2 py-0.5 rounded-full">
                <span className="w-1.5 h-1.5 rounded-full bg-green-500 inline-block"></span>
                <span className="text-green-600 text-xs font-medium">5分钟响应</span>
              </div>
            </div>
            <button onClick={() => setShowHR(true)} className="w-full bg-green-500 hover:bg-green-400 text-white font-semibold py-3 rounded-xl transition-colors mb-4">一键联系 HR</button>
            <div className="border-t border-gray-100 pt-3">
              <div className="text-gray-500 text-xs mb-2">申诉记录</div>
              {appealHistory.map(a => (
                <div key={a.id} className="flex items-center justify-between bg-gray-50 rounded-lg p-3">
                  <div>
                    <div className="text-black text-sm font-medium">{a.issue}</div>
                    <div className="text-gray-400 text-xs">{a.id} · {a.time}</div>
                    {a.eta && <div className="text-orange-500 text-xs">{a.eta}</div>}
                  </div>
                  <span className={`text-xs font-medium ${a.statusColor}`}>{a.status}</span>
                </div>
              ))}
            </div>
          </div>

          <div className="text-center text-gray-300 text-xs pb-4">算法透明助手 · 保护骑手权益</div>
          {showHR && <HRModal onClose={() => setShowHR(false)} />}
        </div>
      );
    }

    /* ── Header ── */
    function Header() {
      return (
        <div className="bg-yellow-400 px-4 py-4 border-b border-yellow-500">
          <div className="flex items-center gap-3 mb-4">
            <div className="w-10 h-10 rounded-full bg-white flex items-center justify-center text-black font-bold text-lg shadow">{riderData.name[0]}</div>
            <div>
              <div className="text-black font-bold">{riderData.name}</div>
              <div className="text-yellow-800 text-xs">黄金骑手 · 工号 {riderData.id}</div>
            </div>
            <span className="ml-auto bg-white text-green-600 text-xs font-bold px-2 py-1 rounded-full">在线</span>
          </div>
          <div className="grid grid-cols-3 gap-2 text-center">
            <div className="bg-yellow-300 rounded-lg p-2"><div className="text-black font-bold text-lg">{riderData.deliveryCount}</div><div className="text-yellow-800 text-xs">今日接单</div></div>
            <div className="bg-yellow-300 rounded-lg p-2"><div className="text-black font-bold text-lg">{riderData.onTimeRate}%</div><div className="text-yellow-800 text-xs">准时率</div></div>
            <div className="bg-yellow-300 rounded-lg p-2"><div className="text-black font-bold text-lg">¥{riderData.earnings}</div><div className="text-yellow-800 text-xs">今日收益</div></div>
          </div>
        </div>
      );
    }

    /* ── 主 App ── */
    function App() {
      const [activeTab, setActiveTab] = useState('home');
      const tabs = [
        { id: 'home',    label: '首页', icon: '🏠' },
        { id: 'orders',  label: '订单', icon: '📦' },
        { id: 'profile', label: '我的', icon: '👤' },
      ];
      return (
        <div className="min-h-screen bg-gray-50 flex flex-col">
          <div className="max-w-md mx-auto w-full flex flex-col min-h-screen bg-white shadow-lg">
            <Header />
            <div className="flex-1 overflow-y-auto">
              {activeTab === 'home'    && <HomeTab />}
              {activeTab === 'orders'  && <OrdersTab />}
              {activeTab === 'profile' && <ProfileTab />}
            </div>
            <div className="border-t border-gray-100 bg-white safe-bottom">
              <div className="grid grid-cols-3">
                {tabs.map(tab => (
                  <button key={tab.id} onClick={() => setActiveTab(tab.id)}
                    className={`py-3 flex flex-col items-center gap-0.5 text-xs transition-colors ${activeTab === tab.id ? 'text-yellow-500 border-t-2 border-yellow-400' : 'text-gray-400 border-t-2 border-transparent'}`}>
                    <span className="text-lg">{tab.icon}</span>{tab.label}
                  </button>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
